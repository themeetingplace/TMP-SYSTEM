<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聚空間 — 住客資料登記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
    :root {
        --brand: #ff8859;
        --brand-hover: #ff743d;
        --text-main: #1a1c23;
        --text-muted: #6b7280;
        --bg: #f4f6f8;
        --card: #ffffff;
        --border: #e7e9ee;
        --success: #22946e;
        --danger: #b13535;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
        margin: 0;
        font-family: 'Noto Sans TC', -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text-main);
        padding: 1rem;
        line-height: 1.5;
    }
    .container {
        max-width: 480px;
        margin: 0 auto;
        background: var(--card);
        border-radius: 12px;
        padding: 1.5rem;
        box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    h1 {
        margin: 0 0 0.5rem;
        font-size: 1.3rem;
        color: var(--brand);
        text-align: center;
    }
    .subtitle {
        text-align: center;
        font-size: 0.85rem;
        color: var(--text-muted);
        margin-bottom: 1.25rem;
    }
    .field { margin-bottom: 1rem; }
    label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 0.35rem;
        color: var(--text-main);
    }
    label .req { color: var(--danger); margin-left: 0.2rem; }
    label .hint {
        font-weight: 400;
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-left: 0.4rem;
    }
    input, select {
        width: 100%;
        padding: 0.7rem 0.8rem;
        font-size: 1rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: white;
        font-family: inherit;
        color: var(--text-main);
        -webkit-appearance: none;
        appearance: none;
    }
    input:focus, select:focus {
        outline: none;
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(255, 136, 89, 0.15);
    }
    .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
    }
    button.submit {
        width: 100%;
        padding: 0.9rem;
        background: linear-gradient(135deg, var(--brand), var(--brand-hover));
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        margin-top: 0.5rem;
        font-family: inherit;
    }
    button.submit:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    .msg {
        padding: 0.8rem 1rem;
        border-radius: 8px;
        margin-bottom: 1rem;
        font-size: 0.85rem;
    }
    .msg.error { background: rgba(177, 53, 53, 0.1); color: var(--danger); }
    .msg.success { background: rgba(34, 148, 110, 0.1); color: var(--success); }
    .loading {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--text-muted);
    }
    .spinner {
        display: inline-block;
        width: 32px;
        height: 32px;
        border: 3px solid var(--border);
        border-top-color: var(--brand);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .user-card {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.6rem 0.8rem;
        background: var(--bg);
        border-radius: 8px;
        margin-bottom: 1rem;
        font-size: 0.85rem;
        color: var(--text-muted);
    }
    .user-card img {
        width: 32px;
        height: 32px;
        border-radius: 50%;
    }
    .done-screen {
        text-align: center;
        padding: 2rem 1rem;
    }
    .done-icon {
        font-size: 4rem;
        margin-bottom: 1rem;
    }

    /* === 身分證上傳 === */
    .id-upload-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
    }
    .id-upload-card {
        border: 2px dashed var(--border);
        border-radius: 8px;
        padding: 0.85rem 0.5rem;
        text-align: center;
        background: var(--bg);
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
        position: relative;
    }
    .id-upload-card:hover {
        border-color: var(--brand);
        background: rgba(255, 136, 89, 0.06);
    }
    .id-upload-card.has-file {
        border-style: solid;
        border-color: var(--success);
        background: rgba(34, 148, 110, 0.05);
    }
    .id-upload-card input[type="file"] {
        position: absolute;
        opacity: 0;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        cursor: pointer;
    }
    .id-upload-icon {
        font-size: 1.8rem;
        line-height: 1;
        margin-bottom: 0.3rem;
        color: var(--brand);
    }
    .id-upload-label {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text-main);
    }
    .id-upload-hint {
        font-size: 0.65rem;
        color: var(--text-muted);
        margin-top: 0.2rem;
    }
    .id-upload-card.has-file .id-upload-icon { color: var(--success); }
    .id-upload-preview {
        width: 100%;
        height: 80px;
        object-fit: cover;
        border-radius: 4px;
        margin-bottom: 0.3rem;
    }
    .id-upload-status {
        font-size: 0.65rem;
        color: var(--success);
        font-weight: 600;
    }
    .id-upload-banner {
        background: rgba(34, 148, 110, 0.08);
        border-left: 3px solid var(--success);
        padding: 0.55rem 0.75rem;
        border-radius: 4px;
        font-size: 0.72rem;
        color: var(--text-muted);
        margin-bottom: 0.5rem;
        line-height: 1.55;
    }
    .id-upload-banner strong { color: var(--success); }
</style>
</head>
<body>

<div class="container" id="root">
    <div class="loading">
        <div class="spinner"></div>
        <div>載入中…</div>
    </div>
</div>

<script>
// ============================================================
// 已填入聚空間 BMS 的設定
// ============================================================
const LIFF_ID = '2010185822-G7D3N3Gw';
const SUPABASE_URL = 'https://zkwkycpfcyecebstmotc.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_qsFrMoFYyM5DMcSt9nvNcg_pah5nruy';
const EDGE_FUNCTION = `${SUPABASE_URL}/functions/v1/tenant-register`;

async function main() {
    try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
            liff.login();
            return;
        }
        const profile = await liff.getProfile();
        renderForm(profile);
    } catch (e) {
        const code = e.code || e.name || '(no code)';
        const msg  = e.message || String(e);
        showError(
            `LIFF 初始化失敗：${msg}\n\n` +
            `code: ${code}\n` +
            `URL: ${location.href}\n\n` +
            `請聯絡小編並附上這段訊息`
        );
        console.error('[LIFF init error]', e);
    }
}

function renderForm(profile) {
    document.getElementById('root').innerHTML = `
        <h1>聚空間 住客登記</h1>
        <div class="subtitle">填完送出，立刻完成 LINE 綁定 ✨</div>

        <div class="user-card">
            <img src="${profile.pictureUrl || ''}" alt="" onerror="this.style.display='none'">
            <span>已透過 LINE 登入：<strong>${profile.displayName}</strong></span>
        </div>

        <form id="form">
            <div class="field">
                <label>姓名<span class="req">*</span></label>
                <input type="text" name="name" required autocomplete="name">
            </div>

            <div class="field">
                <label>手機<span class="req">*</span><span class="hint">用來建立帳單</span></label>
                <input type="tel" name="phone" required pattern="09[0-9]{8}" placeholder="0912345678" autocomplete="tel">
            </div>

            <div class="field">
                <label>Email<span class="hint">選填</span></label>
                <input type="email" name="email" autocomplete="email">
            </div>

            <div class="field">
                <label>緊急聯絡人<span class="hint">選填，例：王媽媽 0911-222-333</span></label>
                <input type="text" name="emergencyContact" placeholder="姓名 + 電話">
            </div>

            <div class="field">
                <label>身分證 / 護照<span class="req">*</span><span class="hint">合約核驗用</span></label>
                <div class="id-upload-banner">
                    🔒 <strong>隱私保護</strong>：照片會自動疊上半透明浮水印「僅供聚空間合約使用」，原圖不保存，只有管理員能查看。<br>
                    🛂 外籍租客請上傳「護照照片頁」+「居留證」(或簽證頁)。
                </div>
                <div class="id-upload-row">
                    <label class="id-upload-card" id="id-card-front">
                        <input type="file" accept="image/*" capture="environment" data-side="front">
                        <div class="id-upload-icon">🪪</div>
                        <div class="id-upload-label">正面 / 照片頁</div>
                        <div class="id-upload-hint">點擊拍照 / 上傳</div>
                    </label>
                    <label class="id-upload-card" id="id-card-back">
                        <input type="file" accept="image/*" capture="environment" data-side="back">
                        <div class="id-upload-icon">🪪</div>
                        <div class="id-upload-label">反面 / 居留證</div>
                        <div class="id-upload-hint">點擊拍照 / 上傳</div>
                    </label>
                </div>
            </div>

            <div id="msg-area"></div>

            <button type="submit" class="submit" id="submitBtn">送出登記</button>
        </form>
    `;

    document.getElementById('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        await handleSubmit(profile);
    });

    // 綁定 ID card 上傳 → Canvas 浮水印
    document.querySelectorAll('.id-upload-card input[type="file"]').forEach(input => {
        input.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const side = input.dataset.side;
            const card = input.closest('.id-upload-card');
            try {
                const watermarked = await addWatermark(file);
                idCardImages[side] = watermarked;
                // 預覽
                const previewUrl = URL.createObjectURL(watermarked);
                card.innerHTML = `
                    <input type="file" accept="image/*" capture="environment" data-side="${side}">
                    <img src="${previewUrl}" class="id-upload-preview" alt="${side}">
                    <div class="id-upload-label">${side === 'front' ? '正面' : '反面'}</div>
                    <div class="id-upload-status">✓ 已加浮水印 (${Math.round(watermarked.size / 1024)} KB)</div>
                `;
                card.classList.add('has-file');
                // 重新綁定 input
                const newInput = card.querySelector('input[type="file"]');
                newInput.addEventListener('change', arguments.callee || (() => {})); // 簡化：重新整頁也行
                // 為了讓重新選取也運作，重新綁
                newInput.addEventListener('change', async (ev) => {
                    const f = ev.target.files[0]; if (!f) return;
                    const wm = await addWatermark(f);
                    idCardImages[side] = wm;
                    const u = URL.createObjectURL(wm);
                    card.querySelector('img').src = u;
                    card.querySelector('.id-upload-status').textContent = `✓ 已加浮水印 (${Math.round(wm.size / 1024)} KB)`;
                });
            } catch (err) {
                console.error('[watermark] failed:', err);
                showSubmitMessage(`圖片處理失敗：${err.message}`, 'error');
            }
        });
    });
}

// 已上傳浮水印照片 (in-memory，submit 時轉 base64 傳給 Edge Function)
const idCardImages = { front: null, back: null };

function showSubmitMessage(text, type) {
    const msg = document.getElementById('msg-area');
    if (msg) msg.innerHTML = `<div class="msg ${type}">${text}</div>`;
}

// Canvas 浮水印 — 對角線重複文字「僅供聚空間合約使用」
// 輸入: File (image)；輸出: Blob (JPEG, 加完浮水印)
// 適用身分證 / 護照 / 居留證 等任何比例 — 看「最大邊」縮放，不論橫直拍都正確
async function addWatermark(file) {
    const img = await fileToImage(file);
    // 看「最大邊」決定縮放比例，不論橫拍直拍護照、攤開護照都正確
    const maxDim = 1400;
    const longerSide = Math.max(img.width, img.height);
    const scale = longerSide > maxDim ? maxDim / longerSide : 1;
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    // 浮水印：對角線重複文字 — fontSize 用較短邊算，避免直拍時文字太大
    const text = '僅供聚空間合約使用';
    const baseDim = Math.min(canvas.width, canvas.height);
    const fontSize = Math.round(baseDim * 0.06);
    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate(-Math.PI / 6); // -30°
    ctx.font = `bold ${fontSize}px "Noto Sans TC", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const spacingY = fontSize * 2.6;
    const spacingX = fontSize * (text.length + 4);
    const range = Math.max(canvas.width, canvas.height) * 1.4;
    for (let y = -range; y < range; y += spacingY) {
        for (let x = -range; x < range; x += spacingX) {
            // 黑描邊 + 白填充 — 任何背景都看得到
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.45)';
            ctx.lineWidth = Math.max(2, fontSize * 0.08);
            ctx.strokeText(text, x, y);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
            ctx.fillText(text, x, y);
        }
    }
    ctx.restore();

    return new Promise((resolve, reject) => {
        canvas.toBlob(
            blob => blob ? resolve(blob) : reject(new Error('canvas toBlob failed')),
            'image/jpeg',
            0.85
        );
    });
}

function fileToImage(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = reject;
            img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]); // 拿掉 data:image/jpeg;base64,
        reader.onerror = reject;
        reader.readAsDataURL(blob);
    });
}

async function handleSubmit(profile) {
    const form = document.getElementById('form');
    const data = Object.fromEntries(new FormData(form).entries());
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('msg-area');

    // 驗證身分證已上傳
    if (!idCardImages.front || !idCardImages.back) {
        msg.innerHTML = `<div class="msg error">請上傳身分證正面與反面照片</div>`;
        return;
    }

    btn.disabled = true;
    btn.textContent = '送出中…';
    msg.innerHTML = '';

    try {
        const idToken = liff.getIDToken();
        // 把 watermark Blob 轉 base64
        btn.textContent = '處理身分證照片…';
        const idCardFrontB64 = await blobToBase64(idCardImages.front);
        const idCardBackB64  = await blobToBase64(idCardImages.back);

        btn.textContent = '上傳中…';
        const resp = await fetch(EDGE_FUNCTION, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            },
            body: JSON.stringify({
                idToken,
                userId: profile.userId,
                displayName: profile.displayName,
                pictureUrl: profile.pictureUrl,
                form: data,
                idCardFront: idCardFrontB64,
                idCardBack: idCardBackB64
            })
        });

        const result = await resp.json();
        if (!resp.ok || result.error) {
            throw new Error(result.error || `HTTP ${resp.status}`);
        }

        renderDone(profile, data);
    } catch (e) {
        msg.innerHTML = `<div class="msg error">送出失敗：${e.message}</div>`;
        btn.disabled = false;
        btn.textContent = '重試';
    }
}

function renderDone(profile, data) {
    document.getElementById('root').innerHTML = `
        <div class="done-screen">
            <div class="done-icon">✅</div>
            <h1>登記完成！</h1>
            <p style="color: var(--text-muted); margin: 1rem 0;">
                ${profile.displayName} 您好<br>
                您的資料已送出，LINE 也綁定完成<br>
                之後合約 / 帳單通知會傳到這裡 ✨
            </p>
            <button class="submit" onclick="liff.closeWindow()" style="max-width: 200px; margin: 1rem auto 0;">關閉視窗</button>
        </div>
    `;
}

function showError(msg) {
    document.getElementById('root').innerHTML = `
        <div class="msg error" style="margin: 2rem 0;">${msg}</div>
        <button class="submit" onclick="location.reload()">重試</button>
    `;
}

main();
</script>

</body>
</html>
