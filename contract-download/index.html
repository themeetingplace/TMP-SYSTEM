<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <title>下載合約 PDF｜聚空間</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <style>
        :root {
            --coral: #ff8555;
            --coral-deep: #e96335;
            --ink: #20242d;
            --muted: #697180;
            --paper: #ffffff;
            --canvas: #f1f3f6;
            --line: #e3e6eb;
            --success: #238765;
            --danger: #ad3f3f;
        }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            margin: 0;
            display: grid;
            place-items: center;
            padding: max(14px, env(safe-area-inset-top)) 12px max(14px, env(safe-area-inset-bottom));
            color: var(--ink);
            background:
                linear-gradient(rgba(255,255,255,.72), rgba(255,255,255,.72)),
                repeating-linear-gradient(0deg, transparent 0 27px, rgba(71, 78, 91, .045) 27px 28px),
                var(--canvas);
            font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .download-card {
            width: min(100%, 720px);
            height: min(920px, calc(100dvh - 28px));
            overflow: hidden;
            background: var(--paper);
            border: 1px solid rgba(32, 36, 45, .08);
            border-radius: 18px;
            box-shadow: 0 22px 54px rgba(30, 38, 52, .12);
        }
        #ready-view { height: 100%; display: flex; flex-direction: column; }
        .content { padding: 18px 20px 12px; }
        .eyebrow {
            margin: 0 0 7px;
            color: var(--coral-deep);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .14em;
        }
        .title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
        h1 { margin: 0; font-size: clamp(21px, 6vw, 28px); line-height: 1.25; letter-spacing: -.02em; }
        .pdf-badge {
            flex: 0 0 auto;
            padding: 7px 10px;
            border-radius: 7px;
            color: #fff;
            background: var(--coral);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .1em;
        }
        .filename {
            margin: 12px 0 0;
            padding: 9px 11px;
            overflow-wrap: anywhere;
            color: #4d5563;
            background: #f6f7f9;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
        }
        .expiry {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.55;
        }
        .expiry svg { flex: 0 0 auto; margin-top: 2px; }
        .preview-shell {
            flex: 1 1 auto;
            min-height: 0;
            margin: 0 14px;
            overflow: hidden;
            border: 1px solid #d7dbe2;
            border-radius: 12px;
            background: #e9ebef;
        }
        .preview-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 38px;
            padding: 0 12px;
            color: #535b68;
            background: #f7f8fa;
            border-bottom: 1px solid #d7dbe2;
            font-size: 12px;
            font-weight: 600;
        }
        .preview-label span:last-child { color: var(--success); }
        .pdf-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
            height: calc(100% - 38px);
            padding: 12px;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            background: #dfe2e7;
        }
        .pdf-page {
            display: block;
            max-width: 100%;
            height: auto;
            background: #fff;
            box-shadow: 0 3px 12px rgba(32, 36, 45, .16);
        }
        .preview-message {
            display: grid;
            place-items: center;
            width: 100%;
            min-height: 180px;
            padding: 24px;
            text-align: center;
            color: var(--muted);
            background: #fff;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.7;
        }
        .action-panel {
            flex: 0 0 auto;
            position: relative;
            z-index: 5;
            padding: 14px 20px max(16px, env(safe-area-inset-bottom));
            background: #fff;
            border-top: 1px solid var(--line);
            box-shadow: 0 -8px 24px rgba(32, 36, 45, .07);
        }
        .action-grid { display: grid; grid-template-columns: 1.4fr .8fr; gap: 10px; }
        .action {
            width: 100%;
            min-height: 54px;
            border-radius: 11px;
            font: 700 16px/1 "Noto Sans TC", sans-serif;
            cursor: pointer;
            transition: transform .14s ease, box-shadow .14s ease, background .14s ease;
        }
        .action:focus-visible { outline: 3px solid rgba(255,133,85,.28); outline-offset: 3px; }
        .action:active { transform: translateY(1px); }
        .action.primary {
            border: 0;
            color: #fff;
            background: var(--coral);
            box-shadow: 0 10px 22px rgba(233, 99, 53, .24);
        }
        .action.primary:hover { background: var(--coral-deep); }
        .action.secondary {
            border: 1px solid var(--line);
            color: var(--ink);
            background: #fff;
        }
        .action:disabled { opacity: .58; cursor: wait; box-shadow: none; }
        .status {
            min-height: 22px;
            margin: 8px 0 0;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }
        .status.success { color: var(--success); }
        .status.error { color: var(--danger); }
        .invalid { padding: 36px 24px; text-align: center; }
        .invalid h1 { font-size: 23px; }
        .invalid p { color: var(--muted); line-height: 1.7; }
        [hidden] { display: none !important; }
        @media (max-width: 420px) {
            .download-card { height: calc(100dvh - 18px); border-radius: 14px; }
            .content { padding: 14px 14px 10px; }
            .preview-shell { margin: 0 9px; min-height: 0; }
            .action-panel { padding: 11px 14px max(12px, env(safe-area-inset-bottom)); }
            .action { min-height: 50px; font-size: 15px; }
        }
        @media (prefers-reduced-motion: reduce) { .action { transition: none; } }
    </style>
</head>
<body>
    <main class="download-card">
        <section id="ready-view">
            <div class="content">
                <p class="eyebrow">THE MEETING PLACE</p>
                <div class="title-row"><h1>請確認您的合約內容</h1><span class="pdf-badge">PDF</span></div>
                <div class="filename" id="filename">合約.pdf</div>
                <div class="expiry">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span>連結自發送後 24 小時內有效，請儘早下載保存。</span>
                </div>
            </div>
            <div class="preview-shell">
                <div class="preview-label"><span>合約內容預覽</span><span>安全連結</span></div>
                <div class="pdf-preview" id="pdf-preview" aria-label="合約 PDF 內容">
                    <div class="preview-message">正在載入合約內容…</div>
                </div>
            </div>
            <div class="action-panel">
                <div class="action-grid">
                    <button class="action primary" id="download-button" type="button">下載 PDF</button>
                    <button class="action secondary" id="preview-button" type="button">全螢幕開啟</button>
                </div>
                <p class="status" id="status" role="status" aria-live="polite"></p>
            </div>
        </section>
        <section class="invalid" id="invalid-view" hidden>
            <h1>下載連結無法使用</h1>
            <p>連結可能已失效或資料不完整，請回到 LINE 聯絡小編重新發送合約。</p>
        </section>
    </main>
    <script>
        const PROJECT_STORAGE_HOST = 'mkatwwouurwxlruisqwe.supabase.co';
        const params = new URLSearchParams(location.search);
        const rawFileUrl = params.get('file') || '';
        const rawName = params.get('name') || '聚空間合約.pdf';
        const safeName = rawName.replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').slice(0, 140) || '聚空間合約.pdf';
        const filename = safeName.toLowerCase().endsWith('.pdf') ? safeName : `${safeName}.pdf`;
        let fileUrl = null;

        try {
            const parsed = new URL(rawFileUrl);
            const allowedPath = parsed.pathname.startsWith('/storage/v1/object/sign/contract-pdfs/');
            if (parsed.protocol === 'https:' && parsed.hostname === PROJECT_STORAGE_HOST && allowedPath) fileUrl = parsed.href;
        } catch {}

        const readyView = document.getElementById('ready-view');
        const invalidView = document.getElementById('invalid-view');
        const downloadButton = document.getElementById('download-button');
        const previewButton = document.getElementById('preview-button');
        const status = document.getElementById('status');

        if (!fileUrl) {
            readyView.hidden = true;
            invalidView.hidden = false;
        } else {
            document.getElementById('filename').textContent = filename;
            renderPdfPreview();
        }

        async function renderPdfPreview() {
            const container = document.getElementById('pdf-preview');
            try {
                if (!window.pdfjsLib) throw new Error('PDF viewer unavailable');
                window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
                const loadingTask = window.pdfjsLib.getDocument({ url: fileUrl, withCredentials: false });
                const pdf = await loadingTask.promise;
                container.innerHTML = '';

                for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
                    const page = await pdf.getPage(pageNumber);
                    const baseViewport = page.getViewport({ scale: 1 });
                    const availableWidth = Math.max(240, container.clientWidth - 24);
                    const cssScale = Math.min(1.6, availableWidth / baseViewport.width);
                    const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
                    const renderViewport = page.getViewport({ scale: cssScale * pixelRatio });
                    const canvas = document.createElement('canvas');
                    canvas.className = 'pdf-page';
                    canvas.width = Math.ceil(renderViewport.width);
                    canvas.height = Math.ceil(renderViewport.height);
                    canvas.style.width = `${Math.floor(renderViewport.width / pixelRatio)}px`;
                    canvas.style.height = `${Math.floor(renderViewport.height / pixelRatio)}px`;
                    canvas.setAttribute('aria-label', `合約第 ${pageNumber} 頁，共 ${pdf.numPages} 頁`);
                    container.appendChild(canvas);
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport: renderViewport }).promise;
                }
            } catch (error) {
                console.warn('[contract-preview]', error);
                container.innerHTML = '<div class="preview-message">合約預覽暫時無法載入，仍可使用下方按鈕下載或全螢幕開啟。</div>';
            }
        }

        previewButton.addEventListener('click', () => {
            if (fileUrl) location.href = fileUrl;
        });

        downloadButton.addEventListener('click', async () => {
            if (!fileUrl) return;
            downloadButton.disabled = true;
            downloadButton.textContent = '準備下載中…';
            status.className = 'status';
            status.textContent = '';
            try {
                // 與畫面預覽使用相同 URL，允許瀏覽器重用已載入的 PDF，避免重複傳輸。
                const response = await fetch(fileUrl, { referrerPolicy: 'no-referrer' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const blob = await response.blob();
                if (!blob.size) throw new Error('empty file');
                const objectUrl = URL.createObjectURL(new Blob([blob], { type: 'application/pdf' }));
                const anchor = document.createElement('a');
                anchor.href = objectUrl;
                anchor.download = filename;
                anchor.rel = 'noopener';
                document.body.appendChild(anchor);
                anchor.click();
                anchor.remove();
                setTimeout(() => URL.revokeObjectURL(objectUrl), 60000);
                status.className = 'status success';
                status.textContent = '下載已開始；iPhone 若顯示預覽，請按分享後選擇「儲存到檔案」。';
            } catch (error) {
                console.warn('[contract-download]', error);
                status.className = 'status error';
                status.textContent = '連結可能已失效，請回到 LINE 聯絡小編重新發送。';
            } finally {
                downloadButton.disabled = false;
                downloadButton.textContent = '下載 PDF';
            }
        });
    </script>
</body>
</html>
