## 🏠 系統簡介

**BMS = Building Management System**（物件管理系統），給聚空間管理「**整租包租 → 分租床位**」這套模式。

### 三個核心觀念

| 觀念 | 說明 |
|---|---|
| **館別** | 一棟整租的房子（例：松山館、信義館）。一個館有多個房間。 |
| **房間 / 床位** | 一個房間可能有 1-4 張床位（R1-A / R1-B / R1-C ...），租客是租「床位」不是租「房間」。 |
| **合約 = 帳單** | 每份合約對應一張帳單（含全期房租）。1 個月合約收 1 個月，3 個月合約收 3 個月（季繳優惠）。**簽約時就收清**，所以系統預設「已繳清」。 |

### 資料流

```
租客 LINE 加 OA → 綁手機 → 點按鈕報修 / 查帳 / 末 5 碼回報
                                ↓
                          Supabase 資料庫
                                ↓
        BMS 後台 (你看到的頁面，跑在瀏覽器，多裝置即時同步)
```

## 🚀 快速開始 (第一次使用)

### 1. 打開系統
瀏覽器開 [BMS 網址]，登入。**第一次開可能慢一點**（從雲端拉資料），之後就快。

### 2. 看左下角同步指示燈
- 🟢 **已同步** = 一切正常
- ⚠️ **錯誤** = 點進去看設定 → 同步分頁的錯誤訊息
- 🚫 **離線** = 網路斷了，先檢查 wifi

### 3. 看首頁 4 張卡片
- **總床位 / 已出租** — 看現在出租率
- **待簽合約** — 還沒簽名的合約數量
- **待處理維修** — 沒完成的維修數
- **本月收入** — 已入帳金額

如果有紅色或警告數字，點下去會進對應頁面處理。

## 📋 常見作業 SOP

### SOP 1: 新租客入住

**情境**：有人看完房決定要住 R1-D 床位。

1. 左側 → **物件管理**
2. 找到 R1-D 那張床（狀態應該是 `待租`）
3. 點該床的 **「入住 / 指派」** 按鈕
4. 表單會自動帶入該床位資訊。填寫：
   - **顧客來源**：fb / 591 / 朋友介紹 / 其他
   - **姓名**：輸入時系統會搜尋舊客 → 找到舊客直接點建議列載入；找不到會顯示「✨ 將建立新顧客」綠色提示
   - **電話 / Email / 緊急聯絡人**
   - **入住日期**（= 合約起始日）
   - **合約期**：1 個月 / 3 個月
   - **月租金**：自動帶床位設定的價格，可調
5. **下方收款記錄**（很重要）：
   - **折扣** $0（季繳優惠請填差額，例如 $1,500）
   - **折扣原因**：例如「季繳優惠」
   - **已收金額**：留空 = 全額收訖；分批收款請填實收金額
   - **付款方式**：匯款 / 現金 / 信用卡
6. 按 **「建立合約」** → 系統自動：
   - 建立租客資料
   - 建立合約
   - 建立對應房租帳單（已繳清 ✅）
   - 床位狀態變「已出租」
   - 同步到 Supabase（其他電腦也會看到）

**完成後檢查**：
- 物件管理 R1-D → 應該變綠色「已出租」
- 租客清單 → 看到新增的租客
- 總收支表 → 看到新的「房租」入帳

---

### SOP 2: 收到 LINE 末 5 碼通知

**情境**：租客匯款後在 LINE 傳「12345」5 位數字。

1. 系統會自動：把末 5 碼存入該租客最早的未繳帳單
2. 進 **房租查帳** 頁
3. 找到該租客的那筆帳單（會有 ⚠️ 末5碼 黃色 badge）
4. 開銀行 App / 對帳系統，找對應入帳紀錄
5. 確認金額 + 末 5 碼吻合
6. 點該筆的 **「核對 + 結帳」** 按鈕
7. 跳出對話框 → 輸入**你在銀行 App 看到的末 5 碼**（不是直接複製租客傳的，要對照）
8. **末 5 碼吻合**：自動標記已收 + 該租客 LINE 收到通知
9. **不吻合**：系統會擋下不讓你結（避免錯帳）

**為什麼要對兩次**：租客可能傳錯、可能金額不對，銀行 App 才是 source of truth。

---

### SOP 3: 建立維修案件

**情境 A — 租客從 LINE 報修**
1. 租客傳「維修：冷氣不冷」
2. 系統自動建立維修紀錄（M00X 編號）
3. 你在 **維修管理** 頁會看到一筆「待處理」案件
4. 點 **「指派」** → 選師傅 / 排時間
5. 完成後點 **「標記完成」**+ 填費用（可選）→ 該租客 LINE 收到通知（如果有設管理員通知）

**情境 B — 管理員手動建立**
1. 維修管理 → **「新增維修」**
2. 選物件、填問題描述、報修者
3. 之後流程同上

---

### SOP 4: 合約到期 / 續約

**系統自動提醒**：合約到期前 10 天，**合約管理** 頁該合約會變黃色「即將到期」。

**續約步驟**：
1. 合約管理 → 找到該合約
2. 點 **「續租」** 按鈕
3. 系統自動產生新合約：
   - 同物件 / 同租客 / 同租金 / 同期數
   - 新期間 = 舊到期日 +1 ~ +30/90 天
   - **新合約帳單預設「未繳」**（因為續約款還沒到）
4. 通知租客匯款 → 租客 LINE 傳末 5 碼 → 走 SOP 2 流程

**重要**：續約 ≠ 重新簽合約。如果租客要換床位 / 換期數 / 改租金，請走 **退租 + 新建合約** 流程。

---

### SOP 5: 退租流程

1. 合約管理 → 找到該合約
2. 點 **「退租」** 按鈕
3. 確認退租日期
4. 系統自動:
   - 合約狀態變「已終止」
   - 床位釋放成「待租」
   - 租客狀態變「已退租」
5. 如果有押金要退，到 **總收支表** → 新增支出 → 類別「押金退還」

---

### SOP 6: 月底結帳 + 跑報表

**每月底執行（建議每月 1-3 號）**

#### 6.1 確認所有應收都收齊
1. 進 **房租查帳**
2. 看「逾期項目」紅色數字 → 應該是 0
3. 如果有 → 個別處理（催繳 / 寬限 / 認列呆帳）

#### 6.2 確認所有支出都登錄
1. 進 **總收支表** → 切到本月
2. 對照銀行對帳單 → 缺的用 **「新增支出」** 補上：
   - 房東租金（每月固定大筆）
   - 水電費 / 網路費 / 管理費
   - 薪水 / 紅利
   - 修繕雜支

#### 6.3 跑報表給房東
1. 進 **各館收入報表**
2. 確認在正確月份
3. 每館點 **「📄 匯出 PDF」**
4. 瀏覽器開新分頁顯示 PDF → 點上方橘色 **「列印 / 儲存為 PDF」**
5. 選「另存為 PDF」傳給對應房東

#### 6.4 跑自己看的總表
1. 進 **總收支表** → 右上 **「📄 匯出 PDF」**
2. 進 **收支分析** → 右上 **「📄 匯出 PDF」**
3. 兩份存檔當月份備份

## 💬 LINE OA 整合

### 租客能做什麼

點 LINE OA 圖文選單按鈕：

| 按鈕 | 行為 |
|---|---|
| 🏠 入住詢問 | 收到填空模板，填好回傳給我們 |
| 🔗 我是房客 | 引導綁定流程 |
| 💬 找管理員 | 留言，管理員接手聊天 |
| 📋 帳單查詢 | 顯示本期合約期間、應繳金額、繳費狀態 |
| 💰 繳款告知 | 提醒傳「末 5 碼」 |
| 🔧 維修申報 | 引導用「維修：xxx」格式 |

### 綁定流程

1. 租客加 OA 為好友
2. 點 🔗 我是房客 → 系統請傳手機號
3. 租客傳 0912345678
4. 系統比對 tenants 表的 phone：
   - 找到 → 綁定成功，下次傳訊息可以直接報修 / 查帳
   - 找不到 → 「⚠️ 找不到此手機號碼」，請聯絡管理員

**綁定追蹤**：去 **租客清單** 頁，第 3 張 KPI 卡 **「LINE 綁定 X%」** 顯示綁定率。點下方「⚠ 待綁 LINE」filter 看誰還沒綁，可一個一個打電話催。

### 管理員手動接手聊天

LINE OA 後台有「**手動聊天**」模式，切過去之後 bot 不會自動回（不會跟你打架），你可以直接私訊。要恢復自動回覆，切回「機器人」模式。

### 進階：管理員 LINE 通知 (可選)

如果希望租客報修 / 報款時你的個人 LINE 收到 push：

1. 加 OA 為好友
2. 傳 `/myid` → 取得自己的 userId
3. Supabase Dashboard → Edge Functions → Secrets → 新增 `ADMIN_LINE_USER_IDS` = `Uxxx...`
4. 重新 Deploy webhook

（目前我們**沒啟用**這個，因為 OA 後台自己會跳訊息，不用重複）

## ⚙️ 系統設定

### 館別管理
新增 / 編輯館別。**禁止刪除**（會影響歷史資料），不用了改「停用」。

### 帳單類型
新增收入 / 支出類型（房租、水電費、薪水、紅利...）。改名會連動已存在的帳單。

### 顧客來源 / 付款方式
跟帳單類型同模式 — 自由新增 / 編輯。可在新增合約時下拉選用。

### 合約範本
每館上傳一份含填入欄位的 PDF：
- `bed_no` — 床號
- `tenant_name` — 乙方姓名
- `rental_period` — 租賃期間
- `rent_amount` — 租金金額
- `deposit_amount` — 押金金額

之後在合約頁點 ⬇ 下載 PDF 會自動填好。

### 雲端同步
- **已同步** = OK
- **錯誤** = 看錯誤訊息，常見：網路斷了 / Supabase 服務異常
- **立即下載** = 強制拉一次最新（多裝置不同步時用）
- **立即上傳** = 強制推一次（資料庫被清空時用，慎用）
- **完整遷移** = 一次性把所有 mockData 上傳（首次部署用）

## 🆘 疑難排解

### 「我看到的數字不對 / 跟同事看到的不一樣」
1. 看左下同步指示燈是不是 🟢
2. 如果是 → 按 `Ctrl + Shift + R` 強制重整
3. 還是不對 → 系統設定 → 雲端同步 → **立即下載**
4. 如果依然錯 → 截圖傳給 IT，提供：哪一頁、哪個數字、預期是多少

### 「LINE OA 不回我」
1. 開 Supabase Dashboard → Edge Functions → line-webhook → Logs
2. 看最近 5 分鐘有沒有 error
3. 紅色 error → 截圖回報
4. 沒 error → 檢查 LINE Developers Console webhook 設定是否啟用

### 「租客傳手機號綁不上」
1. 去 **租客清單** 找這個人
2. 確認他的 `phone` 欄位有沒有填，格式對不對（必須是 09xxxxxxxx，可有 `-` 或空格）
3. 同電話號碼是否有重複租客（重複會綁到第一個）

### 「合約沒對應帳單」
1. 房租查帳 → 點 **「📋 補產缺帳單」**
2. 系統會掃描所有 active 合約，補上沒帳單的

### 「PDF 匯出不能列印」
1. 開新分頁的 PDF 預覽頁 → 上方有橘色「列印 / 儲存為 PDF」按鈕
2. 點下去 → 瀏覽器列印對話框
3. 「目的地」改成「另存為 PDF」
4. 列印 → 選存檔位置

### 「Flatpickr 日期選擇器壞了 / 跑出醜醜的瀏覽器原生選擇器」
1. 強制重整 `Ctrl + Shift + R`
2. 還是壞 → 看 console 有沒有錯誤（F12 開發者工具）

## 📖 名詞對照

| 中文 | 英文 / 系統用語 | 說明 |
|---|---|---|
| 應收 | amount | 帳單應該收的金額 |
| 折扣 | discount | 從應收扣掉的部分（季繳優惠等） |
| 淨應收 | due = amount - discount | 實際要收的數 |
| 已收 | paid_amount | 實際入帳的金額 |
| 繳費狀態 | status | 已繳清 / 部分繳款 / 欠繳（系統自動派生） |
| 期間 | period_start / period_end | 帳單涵蓋的時間範圍 |
| 應結日 | due_date | 應該收到的最後一天 |
| 入帳日 | paid_date | 實際收到的那一天 |
| 末 5 碼 | bank_last5 | 銀行帳戶後 5 碼，用來對帳 |
| 出租率 | occupancy | 已出租床位 / 總床位 |
| 空床損失 | vacancy loss | 預期收入 - 實際收入（空床造成的少賺） |
| 毛利率 | gross margin | (收入 - 房東租金) / 收入 |
| 淨利率 | net margin | (收入 - 所有支出) / 收入 |
